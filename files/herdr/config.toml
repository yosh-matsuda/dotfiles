onboarding = false

[terminal]
new_cwd = "follow"
# A server auto-started by a remote attach inherits a non-login SSH environment, so panes run ~/.profile themselves.
shell_mode = "login"

[keys]
# new_cwd applies to panes, tabs and workspaces alike, so workspaces get $HOME via the command below.
new_workspace = ""

[[keys.command]]
key = "prefix+shift+n"
type = "shell"
command = '"${HERDR_BIN_PATH:-herdr}" workspace create --cwd "$HOME" --focus'

[[keys.command]]
key = "prefix+shift+c"
# Runs on the pane's own server: WSL opens directly, SSH hosts reuse a connected VS Code window or show a code-remote link; herdr >= 0.9.4 keeps OSC 8 from the outer terminal under mouse capture, so Shift+Ctrl+click opens the bare URI it also prints.
# Pane commands ignore shell_mode, so load ~/.profile explicitly for both the WSL `code` command and the fish fallback.
# WSL is detected from the kernel: panes on a saved SSH machine exit 127 here when WSL_DISTRO_NAME is tested instead.
type = "pane"
command = '. "$HOME/.profile"; if grep -qi microsoft /proc/sys/kernel/osrelease; then exec code .; fi; exec fish -c "set -l link (code-remote); and set -q link[1]; and printf \"%s\n\" \$link; and read -n 1 -P \"Press any key to close \" key"'
description = "open pane cwd in VS Code"

[ui]
# false makes herdr take Ctrl+C as copy while a selection exists; Ctrl+C must always reach the pane.
copy_on_select = true
# "auto" draws a fake cursor on WSL, which breaks IME composition anchoring.
host_cursor = "native"
tab_bar_position = "bottom"
tab_bar_right = [
	{ type = "zoom" },
	{ type = "hostname" },
	{ type = "datetime", format = "%m/%d %H:%M" },
]
tab_bar_right_separator = " "
prompt_new_tab_name = false

[ui.toast]
delivery = "terminal"
# The Copilot Stop hook already toasts with the reply text, and herdr's own state
# toast would double it. API notifications ignore this delay, so parking it at the
# maximum keeps herdr's built-in toast from firing during normal use.
delay_seconds = 3600

[theme]
name = "dracula"
auto_switch = false
