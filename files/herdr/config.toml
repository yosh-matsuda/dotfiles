onboarding = false

[terminal]
new_cwd = "follow"
# A server auto-started by a remote attach inherits a non-login SSH environment, so panes run ~/.profile themselves.
shell_mode = "login"

[keys]
# new_cwd applies to panes, tabs and workspaces alike, so workspaces get $HOME via the command below.
new_workspace = ""

[[keys.command]]
key = "prefix+shift+n"
type = "shell"
command = '"${HERDR_BIN_PATH:-herdr}" workspace create --cwd "$HOME" --focus'

[[keys.command]]
key = "prefix+shift+c"
# Runs on the pane's own server, whose own config defines it, so code-remote.sh from the same checkout is there too:
# WSL opens directly, SSH hosts reuse a connected VS Code window or show a code-remote link; herdr >= 0.9.4 keeps OSC 8
# from the outer terminal under mouse capture, so Shift+Ctrl+click opens the bare URI it also prints.
# Pane commands run through /bin/sh -c and ignore shell_mode, so the command loads ~/.profile itself for `code` and the remote CLI.
type = "pane"
command = '''exec bash -c '. "$HOME/.profile"; link=$("$HOME/dotfiles/files/herdr/code-remote/code-remote.sh") && [[ -n $link ]] && printf "%s\n" "$link" && read -rsn 1 -p "Press any key to close "''''
description = "open pane cwd in VS Code"

[ui]
# false makes herdr take Ctrl+C as copy while a selection exists; Ctrl+C must always reach the pane.
copy_on_select = true
# "auto" draws a fake cursor on WSL, which breaks IME composition anchoring.
host_cursor = "native"
tab_bar_position = "bottom"
tab_bar_right = [
	{ type = "zoom" },
	{ type = "command", command = "python3 \"$HOME/dotfiles/files/scripts/copilot-cycle-aic.py\"", interval_seconds = 300, timeout_seconds = 15 },
	{ type = "hostname" },
	{ type = "datetime", format = "%m/%d %H:%M" },
]
tab_bar_right_separator = " │ "
prompt_new_tab_name = false

[ui.sidebar.agents]
row_gap = 0
# state_text shows the labels that files/scripts/herdr-tab-names.mjs reports for Copilot from the title it
# sets. They start with "›"; herdr's own words for other agents, and for Copilot before the first report or in
# the unknown state, are hidden. fg takes no alpha, so each label gets the Dracula color of its state icon mixed
# 60% with the background #282a36: blocked red, done teal, idle green, and working yellow for the rest.
# herdr counts a session waiting for background work as working; its label takes orange, the Dracula peach
# #ffb86c mixed the same way, to set it apart from an agent at work.
rows = [
	["state_icon", "workspace", "machine"],
	[{ token = "tab", fg = "#f8f8f2", bold = true }],
	[{ token = "state_text", rules = [
		{ equals = "› Waiting for input", fg = "#a94449" },
		{ equals = "› Done", fg = "#639dad" },
		{ equals = "› Idle", fg = "#40a75f" },
		{ starts_with = "› Waiting for background", fg = "#a97f56" },
		{ starts_with = "›", fg = "#a1a76a" },
		{ contains = "", hide = true },
	] }],
]

[ui.toast]
delivery = "terminal"
# The Copilot Stop hook already toasts with the reply text, and herdr's own state
# toast would double it. API notifications ignore this delay, so parking it at the
# maximum keeps herdr's built-in toast from firing during normal use.
delay_seconds = 3600

[theme]
name = "dracula"
auto_switch = false
