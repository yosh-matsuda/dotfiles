# Local override of herdr's Copilot detection manifest, which is
# https://herdr.dev/agent-detection/github-copilot.toml at version 2026.08.29.1.
# A local override wins over every remote update, so drop this file once herdr
# publishes a newer version with the change below.
#
# Changed: working_cancel_hint matched its hints anywhere in the recent screen,
# so a reply or a prompt that mentioned "esc interrupt" kept an idle Copilot
# working. Copilot draws the hint in the activity row of its footer, under the
# input box and above the one-line status line, so the rule now reads only the
# bottom lines and skips the input box rows, which start with "┃".
id = "copilot"
version = "2026.08.29.1"
min_engine_version = 1
updated_at = "2026-08-29T00:00:00Z"
aliases = ["github-copilot", "ghcs"]

[[rules]]
id = "selection_blocker"
state = "blocked"
priority = 300
region = "whole_recent"
visible_blocker = true
all = [
  { any = [
    { contains = ["esc to cancel"] },
    { contains = ["esc cancel"] },
  ] },
  { any = [
    { contains = ["enter to select"] },
    { contains = ["enter to confirm"] },
    { contains = ["enter to submit"] },
    { contains = ["enter accept"] },
  ] },
]

[[rules]]
id = "background_agents_working"
state = "working"
priority = 110
region = "bottom_non_empty_lines(6)"
visible_working = true
line_regex = ['^\s*◎\s+Waiting for background agents(?:\s|·|$)']

[[rules]]
id = "working_cancel_hint"
state = "working"
priority = 100
region = "bottom_non_empty_lines(4)"
visible_working = true
line_regex = ['(?i)^\s*[^┃\s].*\besc\s+(?:to\s+cancel|cancel|again\s+to\s+cancel|interrupt)\b']
