# ---- terminal --------------------------------------------------------------
set -g default-terminal "tmux-256color"
set -as terminal-features 'xterm*:RGB'

# 外側の端末に拡張キー報告を要求し、CSI u 形式でペインに渡す
set -s extended-keys always
set -as terminal-features 'xterm*:extkeys'
# extended-keys-format は新しい tmux にしかない
if-shell 'tmux show -s extended-keys-format' \
  'set -s extended-keys-format csi-u'

# ---- general ---------------------------------------------------------------
set -g mouse on
set -g focus-events on
set -g set-clipboard on
set -g history-limit 50000
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
setw -g mode-keys vi

# ---- colors ----------------------------------------------------------------
color_green="green"
color_yellow="colour220"
color_red="colour160"
color_dark="colour238"
color_white="white"

# ---- status line -----------------------------------------------------------
set -g status-style "bg=$color_dark,fg=$color_white"
set -g window-status-format " #I:#W "
set -g window-status-current-format " #I:#W "
set -g window-status-current-style reverse
set -g status-right "#h #[fg=cyan]%m/%d %H:%M#[default] "
set -g status-right-length 60

# ---- plugins ---------------------------------------------------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

run '~/.tmux/plugins/tpm/tpm'
