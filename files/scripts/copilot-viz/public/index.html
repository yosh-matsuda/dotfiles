<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>Copilot Viz</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.mjs"></script>
</head>
<body>
  <header class="top">
    <div class="brand">
      <img src="/icon.svg" alt="" width="24" height="24">
      <span>Copilot Viz</span>
    </div>
    <dl class="stats">
      <div class="stat"><dt>Live</dt><dd id="stat-live">0</dd></div>
      <div class="stat" data-kind="working"><dt>Working</dt><dd id="stat-working">0</dd></div>
      <div class="stat" data-kind="waiting"><dt>Waiting</dt><dd id="stat-waiting">0</dd></div>
      <div class="stat"><dt>Calls 5m</dt><dd id="stat-calls">0</dd></div>
    </dl>
    <span id="conn" class="pill" role="status" aria-live="polite" data-state="connecting">Connecting…</span>
    <button id="theme" class="icon-btn" type="button" title="Toggle theme (t)"></button>
  </header>

  <main class="layout">
    <section class="panel sessions-panel" aria-labelledby="sessions-title">
      <div class="panel-head">
        <h2 id="sessions-title">Sessions</h2>
        <div class="seg" role="group" aria-label="Sessions to show">
          <button type="button" data-filter="live" aria-pressed="true">Live</button>
          <button type="button" data-filter="all" aria-pressed="false">All</button>
        </div>
        <button id="follow" class="toggle" type="button" aria-pressed="true" title="Follow the busiest session (f)">Follow</button>
      </div>
      <div id="host-controls" class="host-controls" hidden>
        <label for="host-filter">Host</label>
        <select id="host-filter"><option value="all">All hosts</option></select>
        <ul id="host-list" class="host-list" aria-label="Host connections"></ul>
      </div>
      <ul id="session-list" class="session-list"></ul>
      <p id="sessions-empty" class="empty" hidden></p>
    </section>

    <div class="center">
      <section class="panel map-panel" aria-labelledby="map-title">
        <div class="panel-head">
          <h2 id="map-title">Agents</h2>
          <div id="session-head" class="session-head"></div>
        </div>
        <p id="host-warning" class="host-warning" role="status" hidden></p>
        <div id="map" class="map"></div>
      </section>

      <section class="panel timeline-panel" aria-labelledby="timeline-title">
        <div class="panel-head">
          <h2 id="timeline-title">Timeline</h2>
          <div id="legend" class="legend" aria-hidden="true"></div>
          <div class="seg" role="group" aria-label="Time window">
            <button type="button" data-zoom="5" aria-pressed="false" title="Last 5 minutes (1)">5m</button>
            <button type="button" data-zoom="15" aria-pressed="true" title="Last 15 minutes (2)">15m</button>
            <button type="button" data-zoom="60" aria-pressed="false" title="Last hour (3)">1h</button>
            <button type="button" data-zoom="360" aria-pressed="false" title="Last 6 hours (4)">6h</button>
          </div>
        </div>
        <div id="timeline-wrap" class="timeline-wrap">
          <canvas id="timeline" tabindex="0" role="application" aria-roledescription="timeline" aria-label="Tool calls over time" aria-describedby="timeline-hint"></canvas>
          <div id="timeline-tip" class="tip" hidden></div>
        </div>
        <p id="timeline-hint" class="sr">Arrow keys move between the calls; Enter opens one.</p>
        <p id="timeline-say" class="sr" aria-live="polite"></p>
      </section>
    </div>

    <section class="panel feed-panel" aria-labelledby="feed-title">
      <div class="panel-head">
        <h2 id="feed-title">Activity</h2>
      </div>
      <div id="feed" class="feed" role="log" aria-labelledby="feed-title"></div>
      <button id="feed-jump" class="jump" type="button" hidden>New activity</button>
    </section>
  </main>

  <aside id="detail" class="detail" aria-labelledby="detail-title" hidden>
    <div class="detail-head">
      <h2 id="detail-title" tabindex="-1"></h2>
      <button id="detail-close" class="icon-btn" type="button" aria-label="Close details" title="Close (Esc)"></button>
    </div>
    <div id="detail-body" class="detail-body"></div>
  </aside>

  <div id="overlay" class="overlay" hidden>
    <div class="overlay-card" role="alertdialog" aria-modal="true" aria-labelledby="overlay-title" aria-describedby="overlay-text">
      <img src="/icon.svg" alt="" width="40" height="40">
      <h2 id="overlay-title" tabindex="-1"></h2>
      <p id="overlay-text"></p>
      <p class="overlay-cmd"><code>copilot-viz</code></p>
    </div>
  </div>

  <div id="probe" class="probe" aria-hidden="true"></div>
</body>
</html>
