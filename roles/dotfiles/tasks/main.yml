- name: Create symbolic links for dotfiles
  ansible.builtin.include_tasks: symlink_entries.yml
  vars:
    dotfiles_link_source_path: "{{ home_dir }}/dotfiles/files/dotfiles"
    dotfiles_link_dest_dir: "{{ home_dir }}"
    dotfiles_link_hidden: true
    dotfiles_link_file_type: any
    dotfiles_link_backup_existing: true

- name: Check local templated dotfiles vars file
  ansible.builtin.stat:
    path: "{{ playbook_dir }}/local.vars.yml"
  delegate_to: localhost
  register: dotfiles_local_vars_file

- name: Load local templated dotfiles vars
  when: dotfiles_local_vars_file.stat.exists
  no_log: true
  ansible.builtin.include_vars:
    file: "{{ playbook_dir }}/local.vars.yml"

- name: Render templated dotfiles into home directory
  ansible.builtin.include_tasks: template_entries.yml
  vars:
    dotfiles_template_source_path: "{{ playbook_dir }}/files/templates"
    dotfiles_template_dest_dir: "{{ home_dir }}"
    dotfiles_template_hidden: true

- name: Create symbolic links for XDG config entries
  ansible.builtin.include_tasks: symlink_entries.yml
  vars:
    dotfiles_link_source_path: "{{ home_dir }}/dotfiles/files/xdg_config"
    dotfiles_link_dest_dir: "{{ xdg_config_home }}"
    dotfiles_link_file_type: any

- name: Ensure herdr config directory exists
  ansible.builtin.file:
    path: "{{ xdg_config_home }}/herdr"
    state: directory
    mode: "0700"

- name: Create symbolic links for herdr config files
  ansible.builtin.include_tasks: symlink_entries.yml
  vars:
    dotfiles_link_source_path: "{{ home_dir }}/dotfiles/files/herdr"
    dotfiles_link_dest_dir: "{{ xdg_config_home }}/herdr"
    dotfiles_link_file_type: file
    dotfiles_link_backup_existing: true

- name: Ensure Copilot CLI config directory exists
  ansible.builtin.file:
    path: "{{ copilot_config_dir }}"
    state: directory
    mode: "0700"

- name: Create symbolic links for Copilot CLI config entries
  ansible.builtin.include_tasks: symlink_entries.yml
  vars:
    dotfiles_link_source_path: "{{ home_dir }}/dotfiles/files/copilot"
    dotfiles_link_dest_dir: "{{ copilot_config_dir }}"
    dotfiles_link_file_type: any
    dotfiles_link_backup_existing: true
    dotfiles_link_excludes:
      - settings.json

# Copilot CLI rewrites settings.json atomically, which replaces a symlink with a
# regular file, so the tracked defaults are merged into the live file instead.
# Keys written locally by the CLI or by `herdr integration install` are kept.
- name: Read the live Copilot CLI settings
  ansible.builtin.slurp:
    src: "{{ copilot_config_dir }}/settings.json"
  register: dotfiles_copilot_settings_live
  failed_when: false

- name: Merge tracked Copilot CLI settings into the live settings
  vars:
    dotfiles_copilot_settings_current: "{{ (dotfiles_copilot_settings_live.content | b64decode | from_json) if 'content' in dotfiles_copilot_settings_live else {} }}"
    dotfiles_copilot_settings_tracked: "{{ lookup('file', playbook_dir ~ '/files/copilot/settings.json') | from_json }}"
  ansible.builtin.copy:
    content: "{{ dotfiles_copilot_settings_current | combine(dotfiles_copilot_settings_tracked, recursive=true) | to_nice_json(indent=2) }}"
    dest: "{{ copilot_config_dir }}/settings.json"
    mode: "0600"

- name: Check the herdr executable
  when: brew_bin_dir is not none
  ansible.builtin.stat:
    path: "{{ brew_bin_dir }}/herdr"
  register: dotfiles_herdr_binary

# herdr writes an absolute hook path into settings.json, so it is installed per
# host rather than tracked. Re-running the installer is idempotent.
- name: Install the herdr Copilot CLI integration
  when: dotfiles_herdr_binary.stat.exists | default(false)
  ansible.builtin.command:
    argv:
      - "{{ brew_bin_dir }}/herdr"
      - integration
      - install
      - copilot
  changed_when: false

# The merge is one way, so keys that exist only in the live file are easy to
# lose track of. The fish prompt cannot report them because it only sees files
# inside this repository, so report them where the merge happens.
- name: Detect Copilot CLI settings that are not tracked
  ansible.builtin.command:
    argv:
      - "{{ ansible_python_interpreter | default('python3') }}"
      - "{{ playbook_dir }}/files/scripts/copilot-settings-drift.py"
      - --json
  changed_when: false
  register: dotfiles_copilot_settings_drift

- name: Report Copilot CLI settings that are not tracked
  vars:
    dotfiles_copilot_untracked: "{{ dotfiles_copilot_settings_drift.stdout | from_json | selectattr('kind', 'eq', 'untracked') | map(attribute='key') | list }}"
  when: dotfiles_copilot_untracked | length > 0
  ansible.builtin.debug:
    msg: "Local only, not tracked in files/copilot/settings.json: {{ dotfiles_copilot_untracked | join(', ') }}"

- name: Ensure bashrc fragments are present
  ansible.builtin.blockinfile:
    path: "{{ home_dir }}/.bashrc"
    create: true
    mode: "0644"
    prepend_newline: true
    marker: "# {mark} ANSIBLE MANAGED BLOCK: {{ item.name }}"
    block: "{{ item.block }}"
  loop: "{{ dotfiles_bashrc_fragments }}"
