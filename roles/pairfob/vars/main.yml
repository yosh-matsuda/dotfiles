pairfob_binary_path: "{{ xdg_local_bin_dir }}/pairfob"
pairfob_download_base: https://pairfob.com/dl
pairfob_install_script_url: https://pairfob.com/install.sh
pairfob_install_script_path: "{{ local_tmp_dir }}/pairfob-install.sh"
pairfob_artifact_name: "pairfob-linux-{{ 'arm64' if ansible_facts['architecture'] in ['aarch64', 'arm64'] else 'amd64' }}"
pairfob_herdr_binary_path: "{{ brew_bin_dir }}/herdr"
pairfob_plugin_repo: arronKler/pairfob
pairfob_systemd_dropin_dir: "{{ xdg_config_home }}/systemd/user/pairfob.service.d"
pairfob_state_dir: "{{ xdg_config_home }}/pairfob"
pairfob_xdg_runtime_dir: "/run/user/{{ ansible_facts['user_uid'] }}"
# include_vars outranks role vars, so local.vars.yml can override this.
pairfob_vapid_subject: "{{ 'mailto:' ~ dotfiles_git_user_email if dotfiles_git_user_email is defined else '' }}"
pairfob_controller_vapid_path: "{{ lookup('ansible.builtin.env', 'HOME') }}/.config/pairfob/vapid.json"
