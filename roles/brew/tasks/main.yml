- name: Check if Homebrew is installed
  when: brew_binary_path is not none
  ansible.builtin.stat:
    path: "{{ brew_binary_path }}"
  register: brew_binary_stat

- name: Create linuxbrew user
  when: is_ubuntu and not brew_is_wsl
  become: true
  ansible.builtin.user:
    name: linuxbrew
    shell: /sbin/nologin
    create_home: yes
    state: present

- name: Install Linux Homebrew prerequisites
  when: is_ubuntu
  become: true
  ansible.builtin.apt:
    name: "{{ brew_linux_prerequisite_packages }}"
    state: present
    update_cache: yes

- name: Install Homebrew on Linux
  when: is_ubuntu and not brew_binary_stat.stat.exists
  block:
  - name: Create Homebrew directories
    become: true
    ansible.builtin.file:
      path: "{{ item }}"
      state: directory
      owner: "{{ brew_linux_owner }}"
      group: "{{ brew_linux_owner }}"
      mode: "0755"
    loop:
    - /home/linuxbrew
    - "{{ brew_prefix_path }}"
    - "{{ brew_prefix_path }}/bin"
    - "{{ brew_prefix_path }}/sbin"
  - name: Create linuxbrew Ansible temporary directory
    when: not brew_is_wsl
    become: true
    ansible.builtin.file:
      path: "{{ brew_exec_home }}/.ansible/tmp"
      state: directory
      owner: "{{ brew_linux_owner }}"
      group: "{{ brew_linux_owner }}"
      mode: "0700"
    register: brew_linux_ansible_tmp_dir
  - name: Check out Homebrew repository on WSL
    when: brew_is_wsl
    ansible.builtin.git:
      repo: https://github.com/Homebrew/brew
      dest: "{{ brew_repository_path }}"
      depth: 1
      update: no
  - name: Check out Homebrew repository on Linux
    when: not brew_is_wsl
    become: true
    become_user: "{{ brew_linux_owner }}"
    ansible.builtin.git:
      repo: https://github.com/Homebrew/brew
      dest: "{{ brew_repository_path }}"
      depth: 1
      update: no
    environment:
      HOME: "{{ brew_exec_home }}"
  - name: Link brew binary
    become: true
    ansible.builtin.file:
      src: ../Homebrew/bin/brew
      dest: "{{ brew_binary_path }}"
      state: link
      owner: "{{ brew_linux_owner }}"
      group: "{{ brew_linux_owner }}"

- name: Install Homebrew on macOS
  when: is_macos and not brew_binary_stat.stat.exists
  block:
  - name: Download Homebrew package
    ansible.builtin.get_url:
      url: https://github.com/Homebrew/brew/releases/latest/download/Homebrew.pkg
      dest: "{{ brew_pkg_path }}"
      mode: "0644"
  - name: Install Homebrew package
    become: true
    ansible.builtin.command:
      cmd: installer -pkg {{ brew_pkg_path }} -target /

- name: Refresh Homebrew installation state
  when: brew_binary_path is not none
  ansible.builtin.stat:
    path: "{{ brew_binary_path }}"
  register: brew_binary_stat

- name: Check Homebrew health
  when: brew_binary_path is not none and brew_binary_stat.stat.exists
  become: "{{ brew_exec_user != ansible_facts['user_id'] }}"
  become_user: "{{ brew_exec_user if brew_exec_user != ansible_facts['user_id'] else omit }}"
  ansible.builtin.shell:
    cmd: |
      eval "$({{ brew_binary_path }} shellenv)"
      {{ brew_binary_path }} doctor
    chdir: "{{ brew_exec_home }}"
  environment:
    HOME: "{{ brew_exec_home }}"
  changed_when: false
  # brew doctor exits with 1 on any warning, such as a deprecated formula that an installed one depends on.
  failed_when: false
  register: brew_doctor

- name: Report Homebrew health warnings
  when: brew_doctor.rc is defined and brew_doctor.rc != 0
  ansible.builtin.debug:
    msg: "{{ brew_doctor.stderr_lines }}"

- name: Install Homebrew packages
  when: brew_binary_path is not none and brew_binary_stat.stat.exists
  become: "{{ brew_exec_user != ansible_facts['user_id'] }}"
  become_user: "{{ brew_exec_user if brew_exec_user != ansible_facts['user_id'] else omit }}"
  community.general.homebrew:
    name: "{{ brew_packages }}"
    path: "{{ brew_bin_dir }}"
    state: present
  environment:
    HOME: "{{ brew_exec_home }}"

- name: Install Homebrew casks
  when: brew_binary_path is not none and brew_binary_stat.stat.exists
  become: "{{ brew_exec_user != ansible_facts['user_id'] }}"
  become_user: "{{ brew_exec_user if brew_exec_user != ansible_facts['user_id'] else omit }}"
  community.general.homebrew_cask:
    name: "{{ brew_casks }}"
    path: "{{ brew_bin_dir }}"
    state: present
  environment:
    HOME: "{{ brew_exec_home }}"

- name: Allow shared Copilot CLI self-updates on Linux servers
  when:
  - is_ubuntu
  - not brew_is_wsl
  - brew_binary_path is not none and brew_binary_stat.stat.exists
  - "'copilot-cli' in brew_casks"
  become: true
  block:
  - name: Allow all users to update existing Copilot CLI files
    ansible.posix.acl:
      path: "{{ brew_prefix_path }}/Caskroom/copilot-cli"
      etype: other
      permissions: rwX
      recursive: true
      follow: false
      state: present

  - name: Find Copilot CLI directories for inherited permissions
    ansible.builtin.find:
      paths: "{{ brew_prefix_path }}/Caskroom/copilot-cli"
      file_type: directory
      recurse: true
      hidden: true
    register: brew_copilot_directories

  - name: Allow all users to update new Copilot CLI files
    ansible.posix.acl:
      path: "{{ item }}"
      etype: other
      permissions: rwx
      default: true
      follow: false
      state: present
    loop: "{{ [brew_prefix_path ~ '/Caskroom/copilot-cli'] + (brew_copilot_directories.files | map(attribute='path') | list) }}"

- name: Remove linuxbrew Ansible temporary directory
  when:
  - is_ubuntu
  - brew_linux_ansible_tmp_dir is defined
  - brew_linux_ansible_tmp_dir.changed
  become: true
  ansible.builtin.file:
    path: "{{ brew_exec_home }}/.ansible"
    state: absent
